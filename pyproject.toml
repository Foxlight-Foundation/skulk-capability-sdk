[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skulk-capability-sdk"
version = "0.5.7"
description = "Public authoring contracts and lifecycle primitives for Skulk capabilities"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "packaging>=24"]

[project.optional-dependencies]
native-credentials = ["keyring>=25,<26"]

[project.urls]
Source = "https://github.com/Foxlight-Foundation/skulk-capability-sdk"
Documentation = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/tree/main/docs"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.11", "basedpyright==1.39.10", "types-jsonschema", "pydantic==2.13.5", "keyring>=25,<26"]

[tool.uv.workspace]
members = ["packages/tools"]

[tool.uv.sources]
skulk-capability-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["skulk_capability_sdk"]
include = ["skulk_capability_sdk/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/skulk_capability_sdk", "/LICENSE.md", "/README.md", "/SOURCE-MANIFEST.json", "/packages/tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/tools/tests"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["skulk_capability_sdk", "tests", "tools", "packages/tools"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

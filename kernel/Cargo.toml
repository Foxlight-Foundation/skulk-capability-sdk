[workspace]
members = [".", "bindings/python", "bindings/node"]
resolver = "3"

[package]
name = "skulk-capability-kernel"
version = "0.4.0-rc.1"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "LICENSE.md"
description = "Shared implementation of Skulk capability contracts and lifecycle"

[dependencies]
ryu = "=1.0.23"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["process", "fs"] }
sha2 = "=0.11.0"
subtle = { version = "=2.6.1", default-features = false }
thiserror = "=2.0.21"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
jsonschema = { version = "=0.58.6", default-features = false, features = ["arbitrary-precision"] }
referencing = { version = "=0.58.6", default-features = false }
regex = "=1.13.1"
fluent-uri = "=0.4.1"
pep440_rs = "=0.7.3"
unicode-normalization = "=0.1.23"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tempfile = "=3.27.0"

[profile.release]
strip = "symbols"
debug = 0
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

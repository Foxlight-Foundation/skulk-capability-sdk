name: Native credential sessions
on:
  pull_request:
    paths:
      - tests_os_credentials/**
      - skulk_capability_sdk/credentials.py
      - skulk_capability_sdk/_credential*.py
      - packages/typescript/src/credentials.ts
      - packages/typescript/src/credential-cohort.ts
      - pyproject.toml
      - uv.lock
      - .github/workflows/native-credentials.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '1767225600'
jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.13'
      - run: >-
          uv sync --frozen --all-packages --no-editable --group native-runtime
          --reinstall-package skulk-capability-sdk --reinstall-package skulk-capability-tools
      - name: Build and audit the current candidate packages
        run: |
          mkdir -p .runtime/native-session
          uv build --all-packages
          uv run --no-sync python tools/check_export.py
          uv run --no-sync python tools/check_tools_export.py
          npm ci --ignore-scripts --prefix packages/typescript
          npm run build --prefix packages/typescript
          npm pack ./packages/typescript --pack-destination .runtime/native-session --json > .runtime/native-session/npm-pack.json
          npm_package="$(.venv/bin/python -c 'import json; print(".runtime/native-session/"+json.load(open(".runtime/native-session/npm-pack.json"))[0]["filename"])')"
          uv run --no-sync python tools/check_typescript_export.py "$npm_package"
          echo "NATIVE_SESSION_NPM_PACKAGE=$npm_package" >> "$GITHUB_ENV"
      - name: Acquire the selected Node runtime without a compiler
        run: uv run --no-sync python tools/prepare_node_qualification.py --output .runtime/selected-node
      - name: Install the independently built public npm package
        run: |
          node_bin="$(.venv/bin/python -c 'from importlib.util import find_spec; from pathlib import Path; s=find_spec("_skulk_node_runtime"); assert s is not None and s.origin is not None; print(Path(s.origin).parent/"bin")')"
          echo "$node_bin" >> "$GITHUB_PATH"
          npm install --ignore-scripts --omit=dev --prefix .runtime/node-installed "./$NATIVE_SESSION_NPM_PACKAGE"
      - name: Install the Linux test-session service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus gnome-keyring
      - name: Exercise real native storage through both public language processes
        shell: bash
        env:
          SKULK_TYPESCRIPT_ENTRY: ${{ github.workspace }}/.runtime/node-installed/node_modules/@foxlight/skulk-capability-sdk/dist/index.js
        run: |
          uv run --no-sync basedpyright --pythonpath .venv/bin/python --project tests_os_credentials/pyrightconfig.json
          if [[ "$RUNNER_OS" == Linux ]]; then
            runtime="/run/user/$(id -u)"
            if [[ ! -d "$runtime" ]]; then
              sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$runtime"
            fi
            test "$(stat -c %u "$runtime")" = "$(id -u)"
            test "$(stat -c %a "$runtime")" = 700
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
            export XDG_DATA_HOME="$PWD/.runtime/native-session/data"
            mkdir -m 700 -p "$XDG_DATA_HOME" .runtime/native-session/control
            bus_pid=''
            keyring_pid=''
            trap 'if [[ -n "$keyring_pid" ]]; then kill "$keyring_pid" || true; wait "$keyring_pid" || true; fi; if [[ -n "$bus_pid" ]]; then kill "$bus_pid" || true; fi' EXIT
            if [[ ! -S "$runtime/bus" ]]; then
              test ! -e "$runtime/bus"
              bus_pid="$(dbus-daemon --session --address="$DBUS_SESSION_BUS_ADDRESS" --fork --print-pid=1)"
            fi
            service_owner="$(dbus-send --session --print-reply --reply-timeout=2000 --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets)"
            if [[ "$service_owner" == *'boolean true'* ]]; then
              echo 'Refusing to replace an existing Secret Service' >&2
              exit 1
            fi
            printf '%s\n' 'disposable-sdk-qualification' | gnome-keyring-daemon --foreground --components=secrets --control-directory="$PWD/.runtime/native-session/control" --unlock > .runtime/native-session/service.log 2>&1 &
            keyring_pid=$!
            ready=false
            for attempt in $(seq 1 100); do
              kill -0 "$keyring_pid"
              service_owner="$(dbus-send --session --print-reply --reply-timeout=1000 --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets)"
              if [[ "$service_owner" == *'boolean true'* ]]; then
                ready=true
                break
              fi
              sleep 0.05
            done
            test "$ready" = true
            export SKULK_TEST_NATIVE_BACKEND=linux_secret_service
          else
            export SKULK_TEST_NATIVE_BACKEND=macos_keychain
          fi
          test "$(node --version)" = v22.23.5
          uv run --no-sync pytest tests_os_credentials --junitxml=.runtime/native-session/tests.xml
      - name: Verify and retain exact source/package custody
        run: |
          git diff --exit-code
          uv run --no-sync python - <<'PYCODE'
          import hashlib, importlib.metadata, json, platform, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('.runtime/native-session')
          cases=ET.parse(root/'tests.xml').findall('.//testcase')
          if len(cases)!=4 or any(c.find(k) is not None for c in cases for k in ('error','failure','skipped')):
              raise ValueError('native-session qualification incomplete')
          if subprocess.check_output(['git','status','--porcelain'],text=True).strip():
              raise ValueError('qualification source is dirty')
          package=root/json.load(open(root/'npm-pack.json'))[0]['filename']
          node=Path(subprocess.check_output(['node','-p','process.execPath'],text=True).strip())
          files=[*Path('dist').glob('*.whl'),*Path('dist').glob('*.tar.gz'),package]
          result={'format':1,'passed':True,'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'platform':platform.system(),'machine':platform.machine(),'sdk_version':importlib.metadata.version('skulk-capability-sdk'),'kernel_version':importlib.metadata.version('skulk-capability-kernel'),'node_sha256':hashlib.sha256(node.read_bytes()).hexdigest(),'packages':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},'cases':sorted(c.attrib['classname']+'.'+c.attrib['name'] for c in cases),'signed_core_owner_admission':False,'provider_authorization':False}
          (root/'qualification.json').write_text(json.dumps(result,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-credentials-${{ matrix.runner }}
          path: |
            .runtime/native-session/tests.xml
            .runtime/native-session/qualification.json
          if-no-files-found: error

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skulk-capability-sdk"
version = "0.5.13rc1"
description = "Public authoring contracts and lifecycle primitives for Skulk capabilities"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "packaging>=24"]

[project.optional-dependencies]
native-credentials = ["keyring>=25,<26"]

[project.urls]
Source = "https://github.com/Foxlight-Foundation/skulk-capability-sdk"
Documentation = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/tree/main/docs"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.11", "basedpyright==1.39.10", "types-jsonschema", "pydantic==2.13.5", "keyring>=25,<26"]

# Explicit compiler-free author-runtime qualification, separate from the legacy SDK.
native-runtime = [
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-macosx_11_0_arm64.whl#sha256=b6f17739d9f49a488194c73a57cbd525c8faab19497c716e0c4ec2a58520d391 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-manylinux_2_34_aarch64.whl#sha256=c4f2c27755ce3545a593f98941eaa3b56f07b185e06b2b76197798096a1a97e3 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.4/skulk_capability_kernel-0.7.0rc4-cp313-abi3-manylinux_2_34_x86_64.whl#sha256=68f7fe9ed6448d68dea4bbe9a8fc12fad7c89f7b3a6102cf69ca1d6119a88f36 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/tools"]

[tool.uv.sources]
skulk-capability-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["skulk_capability_sdk"]
include = ["skulk_capability_sdk/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/skulk_capability_sdk", "/LICENSE.md", "/README.md", "/SOURCE-MANIFEST.json", "/packages/tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/tools/tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["skulk_capability_sdk", "tests", "tools", "packages/tools", "kernel/bindings/python", "tests_native"]
extraPaths = ["kernel/bindings/python", "tests_native"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

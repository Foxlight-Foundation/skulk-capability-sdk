name: Public SDK qualification
on:
  pull_request:
  push:
    branches: [main, feature/capability-developer-tooling]
permissions:
  contents: read
jobs:
  typescript:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.13'
      - run: uv sync --frozen --all-packages --no-editable --group native-runtime --reinstall-package skulk-capability-sdk --reinstall-package skulk-capability-tools
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: npm run build --prefix packages/typescript
      - run: npm run check --prefix packages/typescript
      - run: npm test --prefix packages/typescript
      - run: mkdir -p .runtime/node-installed && npm pack ./packages/typescript --pack-destination .runtime --json > .runtime/npm-pack.json
      - run: uv run --no-sync python tools/check_typescript_export.py .runtime/foxlight-skulk-capability-sdk-0.5.13-rc.1.tgz
      - run: npm install --ignore-scripts --omit=dev --prefix .runtime/node-installed ./.runtime/foxlight-skulk-capability-sdk-0.5.13-rc.1.tgz
      - name: Compile a clean author against the installed declarations
        run: |
          cp packages/typescript/tests/consumer.ts .runtime/node-installed/consumer.mts
          cd .runtime/node-installed
          node ../../packages/typescript/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --lib ES2024 --module NodeNext --moduleResolution NodeNext consumer.mts
      - name: Qualify the independently installed public package
        run: |
          SKULK_TYPESCRIPT_ENTRY="$PWD/.runtime/node-installed/node_modules/@foxlight/skulk-capability-sdk/dist/index.js" \
            uv run --no-sync pytest tests_typescript --junitxml=.runtime/typescript.xml
      - run: git diff --exit-code
      - run: uv run --no-sync python tools/record_typescript_qualification.py
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-${{ matrix.runner }}
          path: |
            .runtime/foxlight-skulk-capability-sdk-0.5.13-rc.1.tgz
            .runtime/npm-pack.json
            .runtime/typescript.xml
            .runtime/typescript-source.json
          include-hidden-files: true
  python:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '1767225600'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.13'
      - run: uv sync --frozen --all-packages --no-editable --group native-runtime --reinstall-package skulk-capability-sdk --reinstall-package skulk-capability-tools
      - run: uv run --no-sync basedpyright --pythonpath .venv/bin/python
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest --junitxml=.runtime/app-root.xml
      - run: uv run --no-sync pytest tests_native --junitxml=.runtime/app-native.xml
      - run: uv build --all-packages
      - run: uv run --no-sync python tools/check_export.py
      - run: uv run --no-sync python tools/check_tools_export.py
      - run: git diff --exit-code
      - run: uv run --no-sync python tools/record_application_qualification.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-${{ matrix.runner }}
          path: |
            dist/*
            .runtime/app-root.xml
            .runtime/app-native.xml
            .runtime/native-app-source.json
          include-hidden-files: true

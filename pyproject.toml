[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skulk-capability-sdk"
version = "0.5.14rc1"
description = "Public authoring contracts and lifecycle primitives for Skulk capabilities"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "packaging>=24"]

[project.optional-dependencies]
native-credentials = ["keyring>=25,<26"]
native-discovery = ["httpx>=0.28.1,<1"]

[project.urls]
Source = "https://github.com/Foxlight-Foundation/skulk-capability-sdk"
Documentation = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/tree/main/docs"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.11", "basedpyright==1.39.10", "types-jsonschema", "pydantic==2.13.5", "keyring>=25,<26", "httpx==0.28.1", "cryptography==50.0.2"]

# Explicit compiler-free author-runtime qualification, separate from the legacy SDK.
native-runtime = [
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.5/skulk_capability_kernel-0.7.0rc5-cp313-abi3-macosx_11_0_arm64.whl#sha256=dba1882aae2473e5e768dfe709848091079ce72e0987bdc640603a4f303baf17 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.5/skulk_capability_kernel-0.7.0rc5-cp313-abi3-manylinux_2_34_aarch64.whl#sha256=c3c829dee6a80089faa21a99b843199421e7f780268807acade773841a29be19 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.5/skulk_capability_kernel-0.7.0rc5-cp313-abi3-manylinux_2_34_x86_64.whl#sha256=ad7dc13b57c6b468345e2eb765dd9524a27a86aa2d47e05d53e48d9d1090ae54 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/tools"]

[tool.uv.sources]
skulk-capability-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["skulk_capability_sdk"]
include = ["skulk_capability_sdk/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/skulk_capability_sdk", "/LICENSE.md", "/README.md", "/SOURCE-MANIFEST.json", "/packages/tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/tools/tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["skulk_capability_sdk", "tests", "tools", "packages/tools", "kernel/bindings/python", "tests_native", "tests_typescript", "tests_packaged", "tests_authoring"]
extraPaths = ["kernel/bindings/python", "tests_native"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skulk-capability-sdk"
version = "0.5.15rc1"
description = "Public authoring contracts and lifecycle primitives for Skulk capabilities"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "packaging>=24"]

[project.optional-dependencies]
native-credentials = ["keyring>=25,<26"]
native-discovery = ["httpx>=0.28.1,<1"]

[project.urls]
Source = "https://github.com/Foxlight-Foundation/skulk-capability-sdk"
Documentation = "https://github.com/Foxlight-Foundation/skulk-capability-sdk/tree/main/docs"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.11", "basedpyright==1.39.10", "types-jsonschema", "pydantic==2.13.5", "keyring>=25,<26", "httpx==0.28.1", "cryptography==50.0.2"]

# Explicit compiler-free author-runtime qualification, separate from the legacy SDK.
native-runtime = [
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-macosx_11_0_arm64.whl#sha256=8b77f0e30457c7b6a3c49d477464b657fc26dc81ddeec31ba32843886fe3e0fc ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-manylinux_2_34_aarch64.whl#sha256=7bae8593f19f067c420b4d906f85076aeda1c3b51fe3e4bda4d1c7ceaabb615b ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "skulk-capability-kernel @ https://github.com/Foxlight-Foundation/skulk-capability-sdk/releases/download/native-v0.7.0-rc.7/skulk_capability_kernel-0.7.0rc7-cp313-abi3-manylinux_2_34_x86_64.whl#sha256=d56b3a2e61571db4f56884c1bf5ed1119479f158f1d4a70e243fc52acffea129 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/tools"]

[tool.uv.sources]
skulk-capability-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["skulk_capability_sdk"]
include = ["skulk_capability_sdk/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["/skulk_capability_sdk", "/LICENSE.md", "/README.md", "/SOURCE-MANIFEST.json", "/packages/tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/tools/tests"]
pythonpath = ["."]
markers = [
    "requires_discovery_v1: new native discovery ABI acceptance, qualified separately from issued runtimes",
    "pre_discovery_v1: explicit unsupported behavior on issued runtimes without discovery",
]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["skulk_capability_sdk", "tests", "tools", "packages/tools", "kernel/bindings/python", "tests_native", "tests_typescript", "tests_packaged", "tests_authoring"]
extraPaths = ["kernel/bindings/python", "tests_native"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

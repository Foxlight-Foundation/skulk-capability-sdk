[build-system]
requires = ["maturin==1.13.1"]
build-backend = "maturin"

[project]
name = "skulk-capability-kernel"
version = "0.1.0"
requires-python = ">=3.13"
description = "Native capability kernel qualification package"
license = { file = "LICENSE.md" }

[tool.maturin]
module-name = "_skulk_capability_kernel"
strip = true

# Keep build-host paths out of artifacts. Dependency evidence is
# retained in Cargo.lock; the distribution NOTICE gate remains separate.
[tool.maturin.sbom]
rust = false

[package]
name = "skulk-capability-python"
version = "0.4.0-rc.1"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "../../LICENSE.md"

[lib]
name = "_skulk_capability_kernel"
crate-type = ["cdylib"]

[dependencies]
skulk-capability-kernel = { path = "../.." }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py313"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
